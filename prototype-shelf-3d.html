<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookshelf 3D — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#fdfcfb; --text:#1a1a1a; --muted:#666; --accent:#555bd8;
  --border:#e5e4e2; --surface:#f5f4f2;
}
::selection { background:var(--accent); color:#fff; }
body {
  font-family:'Newsreader', Georgia, serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.container { max-width:1100px; margin:0 auto; padding:48px 24px 80px; }
.back-link {
  font-family:'Inter',sans-serif; font-size:.8rem; color:var(--muted);
  text-decoration:none; display:inline-flex; gap:6px; margin-bottom:20px;
}
.back-link:hover { color:var(--accent); }
h1 { font-size:2rem; font-weight:400; font-style:italic; letter-spacing:-0.02em; }
.hint { font-family:'Inter',sans-serif; font-size:.82rem; color:var(--muted); margin-top:6px; }

/* ---------- stage ---------- */
.stage {
  position:relative; height:420px; margin-top:8px;
  perspective:1400px; perspective-origin:50% 42%;
  touch-action:pan-y; cursor:grab; user-select:none; -webkit-user-select:none;
}
.stage.dragging { cursor:grabbing; }
.shelf {
  position:absolute; left:50%; top:0; width:0; height:100%;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.22,.9,.3,1);
}
.stage.dragging .shelf { transition:none; }

/* shelf board */
.board {
  position:absolute; left:-40px; right:-40px; top:332px; height:14px;
  background:linear-gradient(#efece7,#e2ded7);
  border-radius:2px;
  box-shadow:0 1px 0 rgba(0,0,0,.06), 0 18px 30px -12px rgba(30,25,20,.18);
}
.board::after {
  content:''; position:absolute; left:0; right:0; top:14px; height:26px;
  background:linear-gradient(rgba(30,25,20,.07), transparent);
}

/* ---------- book ---------- */
.b {
  position:absolute; left:0; top:0; transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.22,.9,.3,1), opacity .4s ease;
  will-change:transform;
}
.b .f {
  position:absolute; left:50%; top:50%;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
}
.b .front { background:var(--surface); overflow:hidden; border-radius:2px 4px 4px 2px; }
.b .front img {
  width:100%; height:100%; object-fit:cover; display:block;
  opacity:0; transition:opacity .35s ease;
}
.b .front img.ok { opacity:1; }
.b .front .shine {
  position:absolute; inset:0; border-radius:inherit;
  background:linear-gradient(100deg, rgba(255,255,255,.18) 0%, transparent 22%, transparent 78%, rgba(0,0,0,.12) 100%);
  pointer-events:none;
}
.b .front .fallback {
  position:absolute; inset:0; display:none; flex-direction:column; justify-content:space-between;
  padding:14px 10px; text-align:center;
}
.b .front.nofallimg .fallback { display:flex; }
.b .front .fallback .ft { font-family:'Newsreader',serif; font-size:.9rem; line-height:1.25; }
.b .front .fallback .fa { font-family:'Inter',sans-serif; font-size:.55rem; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
.b .back { border-radius:4px 2px 2px 4px; }
.b .spine {
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:10px 0 8px; border-radius:2px; overflow:hidden;
}
.b .spine .st {
  writing-mode:vertical-rl; font-family:'Inter',sans-serif; font-weight:500;
  font-size:.62rem; letter-spacing:.04em; max-height:78%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.b .spine .sa {
  writing-mode:vertical-rl; font-family:'Inter',sans-serif; font-size:.5rem;
  opacity:.7; margin-top:auto; max-height:18%; overflow:hidden; white-space:nowrap;
}
.b .edge  { background:repeating-linear-gradient(90deg,#f6f2e9 0px,#f6f2e9 1.5px,#e9e4d8 2.5px); }
.b .etop  { background:repeating-linear-gradient(0deg,#f6f2e9 0px,#f6f2e9 1.5px,#e9e4d8 2.5px); border-radius:1px; }
.b .ebot  { background:#efeadf; }
.b.faded { opacity:.1; pointer-events:none; }
.b .fav {
  position:absolute; left:50%; top:50%; width:20px; height:20px;
  display:flex; align-items:center; justify-content:center;
  font-size:.7rem; color:#d4a574;
  background:#fff; border-radius:50%; box-shadow:0 1px 4px rgba(0,0,0,.2);
}

/* ---------- nav arrows ---------- */
.navbtn {
  position:absolute; top:150px; z-index:5;
  width:36px; height:36px; border-radius:8px;
  background:var(--bg); border:1px solid var(--border);
  font-family:'Inter',sans-serif; font-size:.9rem; color:var(--text);
  cursor:pointer; opacity:0; transition:opacity .25s, border-color .2s;
}
.stage:hover .navbtn { opacity:1; }
.navbtn:hover { border-color:var(--accent); color:var(--accent); }
.navbtn.prev { left:6px; } .navbtn.next { right:6px; }

/* ---------- meta under shelf ---------- */
.meta { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-top:18px; min-height:96px; }
.meta .left { max-width:70%; }
.counter { font-family:'Inter',sans-serif; font-size:.72rem; color:var(--muted); letter-spacing:.12em; }
.mtitle { font-size:1.45rem; font-weight:500; letter-spacing:-0.01em; margin-top:2px; line-height:1.2; }
.mauthor { font-family:'Inter',sans-serif; font-size:.8rem; color:var(--muted); margin-top:2px; }
.mrow { display:flex; align-items:center; gap:10px; margin-top:10px; }
.chip {
  font-family:'Inter',sans-serif; font-size:.65rem; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); border:1px solid var(--border); border-radius:4px; padding:3px 8px;
}
.chip.reading { color:var(--accent); border-color:var(--accent); }
.chip.star { color:#b98a55; border-color:#e2cbaa; }
.inspect-btn {
  font-family:'Inter',sans-serif; font-size:.72rem; padding:6px 12px;
  background:transparent; border:1px solid var(--border); border-radius:5px;
  color:var(--text); cursor:pointer; transition:all .2s;
}
.inspect-btn:hover { border-color:var(--accent); color:var(--accent); }
.progress-wrap { flex:1; max-width:220px; align-self:center; }
.progress-track { height:2px; background:var(--border); border-radius:1px; position:relative; }
.progress-fill { position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:1px; transition:width .3s ease; }

/* ---------- inspect mode ---------- */
.ipanel {
  position:absolute; right:0; top:30px; width:320px; max-width:44%;
  opacity:0; pointer-events:none; transform:translateX(16px);
  transition:opacity .4s ease .1s, transform .4s ease .1s;
  border-left:1px solid var(--border); padding-left:28px;
}
body.inspecting .ipanel { opacity:1; pointer-events:auto; transform:none; }
.ipanel .backshelf {
  font-family:'Inter',sans-serif; font-size:.72rem; color:var(--muted);
  background:none; border:none; cursor:pointer; padding:0; margin-bottom:14px;
}
.ipanel .backshelf:hover { color:var(--accent); }
.ipanel .it { font-size:1.5rem; font-weight:500; line-height:1.15; letter-spacing:-0.01em; }
.ipanel .ia { font-family:'Inter',sans-serif; font-size:.8rem; color:var(--muted); margin-top:4px; }
.ipanel .ichips { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.ipanel .ilink {
  display:inline-block; margin-top:18px;
  font-family:'Inter',sans-serif; font-size:.78rem; color:var(--accent); text-decoration:none;
  border-bottom:1px solid currentColor; padding-bottom:1px;
}
.ipanel .ihint { font-family:'Inter',sans-serif; font-size:.65rem; color:#aaa; margin-top:46px; line-height:1.6; }
body.inspecting .meta, body.inspecting .board { opacity:0; pointer-events:none; }
body.inspecting .stage .navbtn, body.inspecting .stage:hover .navbtn { opacity:0; pointer-events:none; }
.board, .meta { transition:opacity .35s ease; }

@media (max-width:700px) {
  .stage { height:340px; perspective:1000px; }
  .board { top:262px; }
  .ipanel { position:static; max-width:100%; width:100%; border-left:none; padding-left:0; margin-top:12px; display:none; }
  body.inspecting .ipanel { display:block; }
  .mtitle { font-size:1.15rem; }
}
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="#">← Back</a>
  <h1>Bookshelf</h1>
  <p class="hint">Drag the shelf to browse, click a book to pick it up.</p>

  <div style="position:relative">
    <div class="stage" id="stage">
      <button class="navbtn prev" aria-label="Previous book">←</button>
      <div class="board"></div>
      <div class="shelf" id="shelf"></div>
      <button class="navbtn next" aria-label="Next book">→</button>
    </div>

    <div class="ipanel" id="ipanel">
      <button class="backshelf">← Back to shelf</button>
      <div class="it" id="it"></div>
      <div class="ia" id="ia"></div>
      <div class="ichips" id="ichips"></div>
      <a class="ilink" id="ilink" target="_blank" rel="noopener">View this book ↗</a>
      <div class="ihint">drag to orbit · scroll to zoom · esc to close</div>
    </div>
  </div>

  <div class="meta" id="meta">
    <div class="left">
      <div class="counter" id="counter"></div>
      <div class="mtitle" id="mtitle"></div>
      <div class="mauthor" id="mauthor"></div>
      <div class="mrow" id="mrow"></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
    </div>
  </div>
</div>

/* ------- constants ------- */
const H_BASE = 250, GAP = 3, FOCUS_PAD = 64, SHELF_BOTTOM = 336;
const PALETTE = [
  ['#1c1c1c','#f2efe9'], ['#b8433a','#fdf6ee'], ['#d97c3f','#231a12'],
  ['#ece4d2','#3a342a'], ['#8a9b7e','#1f241b'], ['#4a5568','#f0f2f5'],
  ['#a48a64','#241d12'], ['#37455c','#e8ecf3'], ['#7a3b3b','#f5ebe4'],
  ['#5b5f97','#eef0fa'], ['#2f4f43','#e4efe9'], ['#c9a227','#241f0c']
];
function hash(s){ let h=0; for (let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }

/* per-book geometry + colors */
BOOKS.forEach(b => {
  const h = hash(b.t + b.a);
  b.H = H_BASE - 10 + (h % 26);            // 240–266
  b.W = Math.round(b.H * 0.655);           // cover width
  b.T = 24 + (h % 19);                     // thickness 24–42
  const [bg, fg] = PALETTE[h % PALETTE.length];
  b.bg = bg; b.fg = fg;
  // derive a link from the cover URL
  let m;
  if ((m = b.img.match(/isbn\/([0-9Xx]+)-/))) b.link = 'https://www.goodreads.com/search?q=' + m[1];
  else if ((m = b.img.match(/images\/P\/([A-Z0-9]+)\./i))) b.link = 'https://www.amazon.com/dp/' + m[1];
  else b.link = 'https://www.google.com/search?q=' + encodeURIComponent(b.t + ' ' + b.a + ' book');
});

const stage = document.getElementById('stage');
const shelf = document.getElementById('shelf');
const els = [];

/* ------- build DOM ------- */
BOOKS.forEach((b, i) => {
  const d = document.createElement('div');
  d.className = 'b';
  d.dataset.i = i;
  const W = b.W, H = b.H, T = b.T;
  const face = (cls, w, h, tf, extra) =>
    `<div class="f ${cls}" style="width:${w}px;height:${h}px;margin-left:${-w/2}px;margin-top:${-h/2}px;transform:${tf};${extra||''}"></div>`;
  d.innerHTML =
    face('front', W, H, `translateZ(${T/2}px)`) +
    face('back',  W, H, `rotateY(180deg) translateZ(${T/2}px)`, `background:${shade(b.bg,-18)};`) +
    face('spine', T, H, `rotateY(-90deg) translateZ(${W/2}px)`, `background:${b.bg};color:${b.fg};`) +
    face('edge',  T, H, `rotateY(90deg) translateZ(${W/2}px)`) +
    face('etop',  W, T, `rotateX(90deg) translateZ(${H/2}px)`) +
    face('ebot',  W, T, `rotateX(-90deg) translateZ(${H/2}px)`);
  const front = d.querySelector('.front');
  front.innerHTML = `<img alt="${esc(b.t)}" draggable="false"><span class="shine"></span>
    <span class="fallback" style="background:${b.bg};color:${b.fg}"><span class="ft">${esc(b.t)}</span><span class="fa">${esc(b.a)}</span></span>`;
  const spine = d.querySelector('.spine');
  spine.innerHTML = `<span class="st">${esc(b.t)}</span><span class="sa">${esc(shortAuthor(b.a))}</span>`;
  if (b.fav) d.insertAdjacentHTML('beforeend',
    `<div class="f fav" style="transform:translate(${-W/2+14-10}px,${-H/2+14-10}px) translateZ(${T/2+1}px)">★</div>`);
  shelf.appendChild(d);
  els.push(d);
});

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function shortAuthor(a){ const p=a.split(' '); return p.length>1 ? p[p.length-1] : a; }
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const r = Math.max(0,Math.min(255,(n>>16)+amt)), g = Math.max(0,Math.min(255,((n>>8)&255)+amt)), bl = Math.max(0,Math.min(255,(n&255)+amt));
  return `rgb(${r},${g},${bl})`;
}

/* ------- image lazy loading ------- */
const loaded = new Set();
function loadNear(center){
  for (let i = Math.max(0,center-14); i <= Math.min(BOOKS.length-1,center+14); i++){
    if (loaded.has(i)) continue;
    loaded.add(i);
    const img = els[i].querySelector('img');
    const front = els[i].querySelector('.front');
    img.onload = () => { if (img.naturalWidth > 2) img.classList.add('ok'); else front.classList.add('nofallimg'); };
    img.onerror = () => front.classList.add('nofallimg');
    img.src = BOOKS[i].img;
  }
}

/* ------- layout ------- */
let focus = 0, browsing = false, inspecting = false;

function slotW(i, open){ return (open && i===focus) ? BOOKS[i].W : BOOKS[i].T; }

function layout(open){
  // open=true → focused book turned cover-out
  let x = 0;
  const centers = [];
  for (let i = 0; i < BOOKS.length; i++){
    if (open && i === focus) x += FOCUS_PAD;
    const w = slotW(i, open);
    centers.push(x + w/2);
    x += w + GAP;
    if (open && i === focus) x += FOCUS_PAD;
  }
  const offset = -centers[focus];
  for (let i = 0; i < BOOKS.length; i++){
    const b = BOOKS[i];
    const ry = (open && i === focus) ? 0 : 90;
    const y = SHELF_BOTTOM - b.H/2;
    const z = (open && i === focus) ? 40 : 0;
    els[i].style.transform =
      `translateX(${centers[i] + offset}px) translateY(${y}px) translateZ(${z}px) rotateY(${ry}deg)`;
    els[i].classList.toggle('faded', inspecting && i !== focus);
  }
  loadNear(focus);
}

/* ------- meta ------- */
const $ = id => document.getElementById(id);
function pad(n){ return String(n+1).padStart(2,'0'); }
function chipsFor(b){
  let h = '';
  if (b.sec === 'reading') h += `<span class="chip reading">Reading${b.p ? ' · '+b.p+'%' : ''}</span>`;
  if (b.sec === 'next') h += `<span class="chip">Up next</span>`;
  if (b.fav) h += `<span class="chip star">★ Favorite</span>`;
  b.c.split(' ').forEach(c => h += `<span class="chip">${c}</span>`);
  return h;
}
function updateMeta(){
  const b = BOOKS[focus];
  $('counter').textContent = pad(focus) + ' / ' + BOOKS.length;
  $('mtitle').textContent = b.t;
  $('mauthor').textContent = b.a;
  $('mrow').innerHTML = chipsFor(b) + `<button class="inspect-btn" onclick="openInspect()">Inspect ↗</button>`;
  $('pfill').style.width = (focus/(BOOKS.length-1)*100) + '%';
}

/* ------- interactions ------- */
function setFocus(i, open=true){
  focus = Math.max(0, Math.min(BOOKS.length-1, i));
  layout(open);
  updateMeta();
}

document.querySelector('.navbtn.prev').onclick = () => setFocus(focus-1);
document.querySelector('.navbtn.next').onclick = () => setFocus(focus+1);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && inspecting) closeInspect();
  if (inspecting) return;
  if (e.key === 'ArrowLeft') setFocus(focus-1);
  if (e.key === 'ArrowRight') setFocus(focus+1);
});

/* drag browse + orbit */
let down = null;
stage.addEventListener('pointerdown', e => {
  down = { x:e.clientX, y:e.clientY, focus, moved:false, t:Date.now() };
  if (inspecting){ orbit.dragging = true; orbit.px = e.clientX; orbit.py = e.clientY; }
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (inspecting){
    if (orbit.dragging){
      orbit.ry += (e.clientX - orbit.px) * 0.5;
      orbit.rx = Math.max(-75, Math.min(75, orbit.rx - (e.clientY - orbit.py) * 0.5));
      orbit.px = e.clientX; orbit.py = e.clientY;
      applyOrbit();
    }
    return;
  }
  if (!down.moved && Math.abs(dx) > 6){ down.moved = true; browsing = true; stage.classList.add('dragging'); layout(false); }
  if (down.moved){
    const step = 30;
    setFocusLive(down.focus - Math.round(dx/step));
  }
});
function setFocusLive(i){
  const ni = Math.max(0, Math.min(BOOKS.length-1, i));
  if (ni !== focus){ focus = ni; layout(false); updateMeta(); }
}
stage.addEventListener('pointerup', e => {
  if (!down) return;
  const wasDrag = down.moved;
  down = null;
  orbit.dragging = false;
  if (inspecting) return;
  stage.classList.remove('dragging');
  if (wasDrag){ browsing = false; layout(true); return; }
  // click: find book under pointer
  const el = document.elementFromPoint(e.clientX, e.clientY)?.closest('.b');
  if (el){
    const i = +el.dataset.i;
    if (i === focus) openInspect();
    else setFocus(i);
  }
});
stage.addEventListener('pointercancel', () => { down = null; orbit.dragging = false; stage.classList.remove('dragging'); if(!inspecting) layout(true); });

/* ------- inspect (pick up) ------- */
const orbit = { rx:-4, ry:24, z:150, dragging:false, px:0, py:0 };
function applyOrbit(){
  const b = BOOKS[focus], el = els[focus];
  const stageW = stage.clientWidth;
  const panelVisible = window.innerWidth > 700;
  const cx = panelVisible ? stageW*0.34 - stageW/2 : 0;
  el.style.transform =
    `translateX(${cx}px) translateY(${SHELF_BOTTOM - b.H/2 - 60}px) translateZ(${orbit.z}px) rotateX(${orbit.rx}deg) rotateY(${orbit.ry}deg)`;
}
function openInspect(){
  if (inspecting) return;
  inspecting = true;
  orbit.rx = -4; orbit.ry = 24; orbit.z = 150;
  document.body.classList.add('inspecting');
  const b = BOOKS[focus];
  $('it').textContent = b.t;
  $('ia').textContent = b.a;
  $('ichips').innerHTML = chipsFor(b);
  $('ilink').href = b.link;
  $('ilink').textContent = b.link.includes('goodreads') ? 'View on Goodreads ↗' : b.link.includes('amazon') ? 'View on Amazon ↗' : 'Find this book ↗';
  layout(true);
  applyOrbit();
}
function closeInspect(){
  inspecting = false;
  document.body.classList.remove('inspecting');
  layout(true);
}
document.querySelector('.backshelf').onclick = closeInspect;
stage.addEventListener('wheel', e => {
  if (!inspecting) return;
  e.preventDefault();
  orbit.z = Math.max(-40, Math.min(420, orbit.z - e.deltaY * 0.5));
  applyOrbit();
}, { passive:false });

/* ------- init ------- */
setFocus(0);
window.addEventListener('resize', () => { if (inspecting) applyOrbit(); });
</script>
</body>
</html>
